<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🎂 Happy Birthday, Yerzhan!</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    min-height: 100vh;
    color: white;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    position: relative;
}
body::before {
    content: "🎂 Happy Birthday, Yerzhan! 🎉";
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) rotate(-15deg);
    font-size: 3.5em;
    font-weight: bold;
    color: rgba(255, 217, 61, 0.07);
    white-space: nowrap;
    pointer-events: none;
    z-index: 0;
    text-align: center;
    letter-spacing: 3px;
}

#menu {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 20px;
    min-height: 100vh;
    justify-content: center;
}
#menu h1 { font-size: 2.2em; margin-bottom: 5px; }
#menu .sub { color: #aaa; margin-bottom: 25px; }

.difficulty { display: flex; gap: 10px; margin: 15px 0; flex-wrap: wrap; justify-content: center; }
.diff-btn {
    padding: 12px 22px;
    border: 2px solid #555;
    background: transparent;
    color: white;
    border-radius: 12px;
    cursor: pointer;
    font-size: 1em;
    transition: all 0.2s;
}
.diff-btn.active { border-color: #00ff88; background: rgba(0,255,136,0.15); color: #00ff88; }

.btn {
    padding: 15px 50px;
    font-size: 1.3em;
    border: none;
    border-radius: 15px;
    cursor: pointer;
    font-weight: bold;
    transition: all 0.3s;
    margin-top: 20px;
}
.btn-play { background: linear-gradient(135deg, #00ff88, #00cc6a); color: #000; }
.btn-play:hover { transform: scale(1.05); }

/* Game */
#game {
    display: none;
    flex-direction: column;
    align-items: center;
    padding: 15px;
    min-height: 100vh;
}
.game-header {
    display: flex;
    justify-content: space-between;
    width: 100%;
    max-width: 500px;
    padding: 10px;
    margin-bottom: 10px;
}
.stat { text-align: center; }
.stat .val { font-size: 1.5em; font-weight: bold; color: #00ff88; }
.stat .label { font-size: 0.7em; color: #aaa; text-transform: uppercase; }

.board {
    display: grid;
    gap: 8px;
    padding: 10px;
    max-width: 500px;
    width: 100%;
}

.card {
    aspect-ratio: 1;
    perspective: 800px;
    cursor: pointer;
}
.card-inner {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.5s;
    border-radius: 12px;
}
.card.flipped .card-inner, .card.matched .card-inner { transform: rotateY(180deg); }
.card.matched { opacity: 0.6; pointer-events: none; }
.card.peek .card-inner { 
    position: fixed;
    top: 50%;
    left: 50%;
    width: 250px;
    height: 250px;
    transform: rotateY(180deg) translate(50%, -50%);
    z-index: 9999;
    transition: all 0.3s;
}

.card-front, .card-back {
    position: absolute;
    width: 100%; height: 100%;
    backface-visibility: hidden;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
}
.card-front {
    background: linear-gradient(135deg, #1a1a3e, #2d2d5e);
    border: 2px solid #444;
    font-size: 2em;
}
.card-back {
    transform: rotateY(180deg);
    overflow: hidden;
    border: 3px solid #00ff88;
}
.card-back img { width: 100%; height: 100%; object-fit: cover; }

/* Win */
#win {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
    text-align: center;
}
#win h1 { font-size: 2.5em; margin-bottom: 10px; }
#win .stats { color: #aaa; font-size: 1.2em; margin: 15px 0; line-height: 1.8; }
.btn-restart { background: linear-gradient(135deg, #ff6b6b, #ee5a24); color: white; margin-top: 10px; }

.confetti {
    position: fixed; top: -10px;
    border-radius: 2px;
    animation: fall linear forwards;
}
@keyframes fall { to { top: 110vh; transform: rotate(720deg); } }

.overlay {
    display: none;
}
</style>
</head>
<body>
<div class="overlay" id="overlay"></div>

<div id="menu">
    <h1>🎂 Happy Birthday, Yerzhan!</h1>
    <p class="sub">Найди все пары! 🎉</p>
    <p style="color:#aaa;">Выбери сложность:</p>
    <div class="difficulty">
        <button class="diff-btn" data-pairs="4">4 пары</button>
        <button class="diff-btn active" data-pairs="6">6 пар</button>
        <button class="diff-btn" data-pairs="8">8 пар</button>
        <button class="diff-btn" data-pairs="10">10 пар</button>
        <button class="diff-btn" data-pairs="13">Все 13!</button>
    </div>
    <button class="btn btn-play" onclick="startGame()">▶ Играть!</button>
</div>

<div id="game">
    <div class="game-header">
        <div class="stat"><div class="val" id="moves">0</div><div class="label">Ходы</div></div>
        <div class="stat"><div class="val" id="pairs">0/0</div><div class="label">Пары</div></div>
        <div class="stat"><div class="val" id="timer">0:00</div><div class="label">Время</div></div>
    </div>
    <div class="board" id="board"></div>
</div>

<div id="win">
    <h1>🎉 С Днём Рождения, Yerzhan!</h1>
    <div class="stats" id="winStats"></div>
    <button class="btn btn-play" onclick="startGame()">🔁 Ещё раз</button>
    <button class="btn btn-restart" onclick="showMenu()">🔄 Меню</button>
</div>

let numPairs = 6;
let cards = [];
let flipped = [];
let matched = 0;
let moves = 0;
let timerInterval = null;
let startTime = 0;
let locked = false;

document.querySelectorAll('.diff-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        numPairs = parseInt(btn.dataset.pairs);
    });
});

function showMenu() {
    document.getElementById('menu').style.display = 'flex';
    document.getElementById('game').style.display = 'none';
    document.getElementById('win').style.display = 'none';
}

function startGame() {
    const actualPairs = Math.min(numPairs, PHOTOS.length);
    const shuffled = [...PHOTOS].sort(() => Math.random() - 0.5);
    const selected = shuffled.slice(0, actualPairs);

    cards = [];
    selected.forEach((src, i) => {
        cards.push({ id: i, src });
        cards.push({ id: i, src });
    });
    for (let i = cards.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [cards[i], cards[j]] = [cards[j], cards[i]];
    }

    flipped = [];
    matched = 0;
    moves = 0;
    locked = false;

    const total = cards.length;
    let cols = total <= 8 ? 4 : total <= 12 ? 4 : total <= 20 ? 5 : 6;

    const board = document.getElementById('board');
    board.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    board.innerHTML = cards.map((card, i) => `
        <div class="card" data-index="${i}" onclick="flipCard(this)">
            <div class="card-inner">
                <div class="card-front">❓</div>
                <div class="card-back"><img src="${card.src}"></div>
            </div>
        </div>
    `).join('');

    document.getElementById('moves').textContent = '0';
    document.getElementById('pairs').textContent = `0/${actualPairs}`;
    document.getElementById('timer').textContent = '0:00';

    document.getElementById('menu').style.display = 'none';
    document.getElementById('win').style.display = 'none';
    document.getElementById('game').style.display = 'flex';

    if (timerInterval) clearInterval(timerInterval);
    startTime = Date.now();
    timerInterval = setInterval(() => {
        const e = Math.floor((Date.now() - startTime) / 1000);
        document.getElementById('timer').textContent =
            `${Math.floor(e/60)}:${(e%60).toString().padStart(2,'0')}`;
    }, 1000);
}

function flipCard(el) {
    if (locked) return;
    const idx = parseInt(el.dataset.index);
    if (el.classList.contains('flipped') || el.classList.contains('matched')) return;

    el.classList.add('flipped');
    el.classList.add('peek');
    setTimeout(() => {
        el.classList.remove('peek');
    }, 1000);
    flipped.push({ el, idx });

    if (flipped.length === 2) {
        moves++;
        document.getElementById('moves').textContent = moves;
        locked = true;
        const [a, b] = flipped;
        if (cards[a.idx].id === cards[b.idx].id) {
            setTimeout(() => {
                a.el.classList.add('matched');
                b.el.classList.add('matched');
                matched++;
                document.getElementById('pairs').textContent =
                    `${matched}/${cards.length/2}`;
                flipped = [];
                locked = false;
                if (matched === cards.length / 2) winGame();
            }, 400);
        } else {
            setTimeout(() => {
                a.el.classList.remove('flipped');
                b.el.classList.remove('flipped');
                flipped = [];
                locked = false;
            }, 800);
        }
    }
}

function winGame() {
    clearInterval(timerInterval);
    const e = Math.floor((Date.now() - startTime) / 1000);
    setTimeout(() => {
        document.getElementById('game').style.display = 'none';
        document.getElementById('win').style.display = 'flex';
        document.getElementById('winStats').innerHTML = `
            Ходов: <strong>${moves}</strong><br>
            Время: <strong>${Math.floor(e/60)}:${(e%60).toString().padStart(2,'0')}</strong><br>
            Пар: <strong>${cards.length/2}</strong>
        `;
        for (let i = 0; i < 50; i++) {
            const c = document.createElement('div');
            c.className = 'confetti';
            c.style.left = Math.random()*100+'vw';
            c.style.background = ['#ff6b6b','#00ff88','#ffd93d','#6c5ce7','#fd79a8','#00cec9'][Math.floor(Math.random()*6)];
            c.style.animationDuration = (1+Math.random()*2)+'s';
            c.style.animationDelay = Math.random()*0.5+'s';
            c.style.width = (5+Math.random()*8)+'px';
            c.style.height = (5+Math.random()*8)+'px';
            document.body.appendChild(c);
            setTimeout(() => c.remove(), 4000);
        }
    }, 500);
}
</script>
